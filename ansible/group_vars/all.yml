# ---- What to deploy ----
image_name: akashpathak9587/village-portfolio   # override with -e image_name=...
image_tag: latest                                   # Jenkins passes the build number
container_name: village-portfolio
host_port: 80                                       # public port on the server → container port 80

# ---- Registry login (optional; only needed for PRIVATE images) ----
# Values come from environment variables so secrets never live in git.
# Alternatively store them with: ansible-vault encrypt_string 'token' --name registry_password
registry_url: https://index.docker.io/v1/
registry_username: "{{ lookup('env', 'REGISTRY_USERNAME') | default('', true) }}"
registry_password: "{{ lookup('env', 'REGISTRY_PASSWORD') | default('', true) }}"

# ---- Housekeeping ----
prune_old_images: true
open_firewall: true    # opens host_port (and SSH) in UFW on Ubuntu/Debian if UFW is installed
