# Run Jenkins locally or on a CI server:
#   cd jenkins && DOCKER_GID=$(stat -c '%g' /var/run/docker.sock) docker compose up -d --build
# (On macOS with Docker Desktop, DOCKER_GID can be left unset.)
services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8081:8080"   # Jenkins UI → http://<host>:8081
      - "50000:50000" # inbound agents
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
